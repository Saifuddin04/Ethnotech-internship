<!DOCTYPE html>
<html>
<head>
<title>Quiz Game</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">


</head>

<body>

<div class="quiz-box">

<h4 id="progress">Progress: 0</h4>

<div class="progress mb-3">
  <div id="progressBar" class="progress-bar" style="width:0%"></div>
</div>

<h3 id="question"></h3>

<div id="options"></div>

<h4 class="mt-3">Score: <span id="score">0</span></h4>

<button onclick="loadQuestion()" class="btn btn-warning mt-3">Skip</button>

</div>

<script>
let currentQ = null;

async function loadQuestion() {
    const res = await fetch("/quiz");
    const data = await res.json();

    if (data.completed) {
        window.location.href = "/quiz-completed";
        return;
    }

    currentQ = data;

    document.getElementById("question").innerText = data.question;

    document.getElementById("progress").innerText =
        `Questions Done: ${data.progress + 1} / ${data.total}`;

    let percent = ((data.progress + 1) / data.total) * 100;
    document.getElementById("progressBar").style.width = percent + "%";

    let optionsHTML = "";

    ["A","B","C","D"].forEach((letter, index) => {
        optionsHTML += `
        <button class="btn btn-primary option-btn"
            onclick="submitAnswer('${letter}', this)">
            ${letter}. ${data.options[index]}
        </button>
        `;
    });

    document.getElementById("options").innerHTML = optionsHTML;
}

async function submitAnswer(option, btn) {

    const res = await fetch("/quiz", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            qid: currentQ.id,
            option: option
        })
    });

    const data = await res.json();

    let buttons = document.querySelectorAll(".option-btn");

    buttons.forEach(b => {
        if (b.innerText.startsWith(data.correct)) {
            b.classList.add("correct");
        }
    });

    if (option !== data.correct) {
        btn.classList.add("wrong");
    }

    document.getElementById("score").innerText = data.score;

    setTimeout(loadQuestion, 1200);
}

// initial load
loadQuestion();
</script>

</body>
</html>
