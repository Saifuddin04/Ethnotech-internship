{% extends "base.html" %}

{% block content %}

{% if category_name %}
    <h2 class="mb-4">Category: {{ category_name }}</h2>
{% else %}
    <h2 class="mb-4">All Posts</h2>
{% endif %}

{% for post in posts %}
<div class="card mb-4 shadow-sm">
    <div class="card-body">

        <h3>
            <a href="/post/{{ post.id }}" class="text-decoration-none">
                {{ post.title }}
            </a>
        </h3>

        <p class="text-muted">
            By {{ post.author }} • {{ post.date.strftime('%d %b %Y') }}
        </p>

        <span class="badge bg-secondary">
            <a href="/category/{{ post.category.id }}" class="text-white text-decoration-none">
                {{ post.category.name }}
            </a>
        </span>

    </div>
</div>
{% endfor %}

{% endblock %}
