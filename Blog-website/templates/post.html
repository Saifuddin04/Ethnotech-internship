{% extends "base.html" %}

{% block content %}

<h1>{{ post.title }}</h1>
<p class="text-muted">By {{ post.author }} • {{ post.date.strftime('%d %b %Y') }}</p>

<span class="badge bg-secondary mb-3">
    {{ post.category.name }}
</span>

<hr>

<p style="white-space: pre-line;">{{ post.content }}</p>

{% if session.get("admin") %}
<hr>
<div class="d-flex gap-2">
    <a href="/edit/{{ post.id }}" class="btn btn-warning">Edit</a>
    <a href="/delete/{{ post.id }}" class="btn btn-danger" onclick="return confirm('Delete this post?')">Delete</a>
</div>
{% endif %}

{% endblock %}
