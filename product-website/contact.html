<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- DARK MODE TOGGLE (keep input outside for CSS) -->
<input type="checkbox" id="dark-toggle">

<!-- NAVBAR -->
<nav class="navbar">
  <h2 class="logo">NetWave Internet</h2>

  <div class="nav-right">

    <!-- MOBILE MENU -->
    <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="menu-toggle">☰</label>

    <!-- NAV LINKS -->
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="features.html">Features</a></li>
      <li><a href="pricing.html">Pricing</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

    <!-- DARK MODE BUTTON -->
    <label for="dark-toggle" class="dark-btn">🌙 / ☀️</label>
  </div>
</nav>

<!-- CONTACT -->
<section class="contact-section">
  <h2>Get in Touch</h2>
  <p class="contact-subtext">We’d love to hear from you</p>

  <div class="contact-container">

    <form class="contact-form">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea rows="5" placeholder="Your Message"></textarea>
      <button type="submit">Send Message</button>
    </form>

    <div class="contact-info">
      <h3>Contact Info</h3>
      <p>📍 Mysuru, India</p>
      <p>📞 +91 98765 43210</p>
      <p>✉️ support@netwave.com</p>
    </div>

  </div>
</section>

<footer>
  <p>© 2026 NetWave Internet</p>
</footer>

</body>
</html>
